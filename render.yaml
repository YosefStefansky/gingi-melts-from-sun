# Render Blueprint - deploys the Home Inventory API as a web service.
#
# Usage: in the Render dashboard, New -> Blueprint -> connect this repo
# (branch: claude/shopping-inventory-alexa-rnq5fe, or main once merged) ->
# Render finds this file and proposes the service below -> Apply.
#
# The service serves both the REST API (/api/*) and the web UI (everything
# else) from one Node process - see home-inventory/server/src/server.js.
services:
  - type: web
    name: home-inventory-api
    env: node
    plan: free
    rootDir: home-inventory/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_KEY
        generateValue: true
      # Free-tier Render disk doesn't survive redeploys or sleep/wake
      # cycles, so data needs to live off-box: free Upstash Redis
      # (https://console.upstash.com) via its REST API. Create a database
      # there, open its "REST API" section, and paste the two values it
      # shows (Render will prompt for these since they're not templated
      # here) - see home-inventory/server/.env.example for details.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
