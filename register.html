<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlcoSmart - הרשמה</title>
    <link rel="stylesheet" href="registerStyles.css">
</head>
<body>
    <div class="container">
       

        <!-- Right Side -->
        <div class="right-section">
            <div class="alert-box">
                <strong>שלום!</strong><br>
                המערכת נועדה בשבילך שתוכל לנהל את מערכת ההזמנה של AlcoSmart 
                ותדע מה קורה כל רגע עם כל המשתמשים שלך.
            </div>

            <h2 class="title">הרשמה</h2>

            <!-- Registration Form -->
            <form >
                <div class="input-group">
                    <input type="text" placeholder="שם מלא">
                    <span class="icon">👤</span>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="אימייל">
                    <span class="icon">📧</span>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="סיסמא">
                    <span class="icon">🔒</span>
                </div>

                <button type="submit" class="register-btn">הרשמה</button>

                <p class="login-text">התחברת אלינו בעבר? <a href="#" class="login-link">התחברות</a></p>
            </form>
        </div>
		 <!-- Left Side -->
        <div class="left-section">
            <img src="logo.png" alt="AlcoSmart Logo" class="logo">
        </div>
    </div>
</body>
</html>
